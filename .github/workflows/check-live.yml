name: check-live

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs can start a few minutes late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check YouTube and write Firestore status/live
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIRESTORE_PROJECT: uklive-f7b27
        run: python check_live.py
