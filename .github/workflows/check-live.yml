name: check-live

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs can start a few minutes late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-live
  cancel-in-progress: true   # a new run cancels any in-progress run

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      live: ${{ steps.out.outputs.live }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the last published live.json (keeps the shows list if YouTube fails)
        run: |
          git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:live.json > old_live.json || echo "{}" > old_live.json
      - name: Check YouTube, write Firestore status/live and live.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIRESTORE_PROJECT: uklive-f7b27
        run: python check_live.py --out live.json --old old_live.json
      - id: out
        if: always()
        run: |
          if [ -s live.json ] && python -c "import json;json.load(open('live.json'))"; then
            echo "live=$(base64 -w0 live.json)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    # Only this job can write to the repo, and it has no access to the secrets.
    needs: check
    if: always() && needs.check.outputs.live != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Force-push live.json as a single commit on branch data
        env:
          LIVE_B64: ${{ needs.check.outputs.live }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub
          git init -q -b data
          echo "$LIVE_B64" | base64 -d > live.json
          python3 -c "import json;json.load(open('live.json'))"
          if grep -qE 'AIza[0-9A-Za-z_-]{20}' live.json; then echo "key pattern found, not publishing"; exit 1; fi
          git -c user.name="uklive-status-bot" -c user.email="actions@users.noreply.github.com" add live.json
          git -c user.name="uklive-status-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "live.json $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data:data
          echo "published"
